<div class="pw-gallery">
{{ range hugo.Data.screenshots }}
  <figure class="pw-gallery-entry">
    <a href="shots/{{ .image }}"><img src="thumbs/{{ .image }}" alt="Desktop screenshot, {{ .date }}" loading="lazy"></a>
    <figcaption><span class="date">{{ .date }}:</span> {{ .desc | safeHTML }}</figcaption>
  </figure>
{{ end }}
</div>
