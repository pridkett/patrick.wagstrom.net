{{- $summary := .Summary | plainify | htmlUnescape | replaceRE "\\s+" " " | strings.TrimSpace -}}
{{- $words := split $summary " " -}}
<article class="pw-entry">
  <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "January 2, 2006" }}</time>
  <h2><a href="{{ .RelPermalink }}">{{ .Title | htmlUnescape }}</a></h2>
  <p>{{ delimit (first 45 $words) " " }}{{ if gt (len $words) 45 }}…{{ end }}</p>
</article>
