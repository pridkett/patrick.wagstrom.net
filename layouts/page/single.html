{{ partial "header.html" . }}
<main class="pw-document">
  <h1 class="pw-page-title">{{ .Title }}</h1>
  {{ if .Params.archived }}
  <p class="pw-archive-note">Historical tutorial, originally published {{ .Date.Format "January 2, 2006" }}. Preserved with its original instructions and screenshots.</p>
  {{ end }}
  <div class="pw-document-body">{{ .Content }}</div>
</main>
{{ partial "footer.html" . }}
