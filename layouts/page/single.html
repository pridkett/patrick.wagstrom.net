{{ partial "header.html" . }}

<div class="container white-rounded">
  <div class="row">
    <div class="col-md-12">
      <h3 class="page-title">{{ .Title }}</h3>
    </div>
  </div>
  <div class="row">
    <div class="col-md-12">
      {{ if .Params.archived }}
      <p class="alert alert-info">Historical tutorial, originally published {{ .Date.Format "January 2, 2006" }}. Preserved with its original instructions and screenshots.</p>
      {{ end }}
      {{ .Content }}
    </div>
  </div>
</div>

{{ partial "footer.html" . }}
